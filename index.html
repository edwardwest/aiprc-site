  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lor:#001A33\">AI Psychological Research Coalition<\u002Fh1>\n    <img data-fade=\"1\" src=\"4f5299da-87f1-463d-b541-8ed0b959b6ab\" alt=\"Continuous linework image of two abstract silhouettes of heads looking away from each other. Another line links between their minds, drawing the AIPHR logo in one of their minds.\" style=\"display:block;width:clamp(0px, (100vw - 767px) * 999, 968px);max-width:calc(100% - 115px);height:auto;margin:clamp(0px, (100vw - 767px) * 999, 68px) 0 0 clamp(0px, (100vw - 767px) * 999, 115px)\">\n    <img data-fade=\"1\" src=\"9b2a07fe-d200-4dce-ba28-5b24bdeda6ff\" alt=\"Continuous linework image of two abstract silhouettes of heads looking away from each other, linked by a thread.\" style=\"display:block;width:clamp(0px, (767px - 100vw) * 999, 360px);max-width:none;height:auto;margin:clamp(0px, (767px - 100vw) * 999, 76px) 0 0 clamp(-20px, (100vw - 767px) * 999, 0px)\">\n    <p style=\"position:relative;width:clamp(331px, (100vw - 767px) * 999, 359px);max-width:100%;margin:clamp(-48px, (767px - 100vw) * 999, 39px) clamp(2px, (100vw - 767px) * 999, 20px) 0 auto;text-align:justify;font-size:16px;line-height:clamp(24px, (100vw - 767px) * 999, 26.4px)\">The AI Psychological Research Coalition is a network of leading academic and professional institutions focused on gathering evidence, advancing research, and building a rigorous, evidence-based understanding of the psychological effects that AI systems are having on human health and wellbeing.<\u002Fp>\n    <div style=\"position:relative;width:clamp(331px, (100vw - 767px) * 999, 359px);max-width:100%;margin:20px clamp(2px, (100vw - 767px) * 999, 20px) 0 auto;display:flex;gap:20px;flex-wrap:wrap\">\n      <a href=\"{{ r.about }}\" style=\"display:inline-block;padding:12px 24px;border-radius:64px;border:1px solid #001A33;background:#fff;color:#001A33;font-size:15px;line-height:15px;font-weight:500\" style-hover=\"background:#E9F5FE\">About us<\u002Fa>\n      <a href=\"#contribute\" style=\"display:inline-block;padding:12px 24px;border-radius:64px;background:#001A33;color:#fff;font-size:15px;line-height:15px;font-weight:500\" style-hover=\"background:#113768;color:#fff\">How to contribute<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ d }}\" hint-placeholder-val=\"{{ true }}\">\n<section style=\"margin-top:128px;background:#E9F5FE;padding:32px 10px;height:230px;box-sizing:border-box\">\n  <div style=\"max-width:1140px;margin:0 auto;display:flex;justify-content:space-between;gap:40px\">\n    <div style=\"width:456px\">\n      <h3 style=\"font-size:36px;line-height:43.2px;font-weight:600;color:#001A33\">Our Affiliations<\u002Fh3>\n      <p style=\"margin-top:20px;color:#111111\">This research initiative is supported by a network of institutions committed to advancing psychological health and safety.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:452px 98px;grid-template-rows:80px auto;align-items:start\">\n      <img src=\"f10105e6-2a71-464f-a542-37179384724e\" alt=\"Logo for the Winston Center of Technology and Brain Development\" style=\"width:442px;height:70px;object-fit:contain\">\n      <img src=\"09267243-a9f5-4ad0-8d4b-226b9431e828\" alt=\"Logo of the Center for Humane Technology\" style=\"width:98px;height:59px;margin-top:6px\">\n      <img src=\"ec6a5222-c76b-4c6e-b0ed-9e638d3f7398\" alt=\"Fairplay logo - childhood beyond brands\" style=\"width:194px;height:51px;margin:17px 0 0 71px\">\n      <img src=\"9984f13c-8d17-460a-b6de-aa12f339236c\" alt=\"Logo for Human Change, depicting a mother morphing into a robot holding a phone.\" style=\"width:50px;height:86px;margin-left:28px\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{ m }}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"margin-top:32px;background:#E9F5FE;padding:20px 20px 50px;text-align:center\">\n  <h3 style=\"font-size:25.54px;line-height:33.2px;font-weight:600;color:#001A33\">Our Affiliations<\u002Fh3>\n  <p style=\"margin-top:20px;color:#111111\">This research initiative is supported by a network of institutions committed to advancing psychological health and safety.<\u002Fp>\n  <div style=\"margin-top:16px;overflow:hidden;width:100%\">\n    <div style=\"display:flex;transition:{{ trans }};transform:{{ tx }}\">\n      <div style=\"flex:0 0 100%;height:90px;display:flex;align-items:center;justify-content:center\"><img src=\"f10105e6-2a71-464f-a542-37179384724e\" alt=\"Logo for the Winston Center of Technology and Brain Development\" style=\"max-width:100%;max-height:90px;height:auto\"><\u002Fdiv>\n      <div style=\"flex:0 0 100%;height:90px;display:flex;align-items:center;justify-content:center\"><img src=\"09267243-a9f5-4ad0-8d4b-226b9431e828\" alt=\"Logo of the Center for Humane Technology\" style=\"max-width:100%;height:90px\"><\u002Fdiv>\n      <div style=\"flex:0 0 100%;height:90px;display:flex;align-items:center;justify-content:center\"><img src=\"ec6a5222-c76b-4c6e-b0ed-9e638d3f7398\" alt=\"Fairplay logo - childhood beyond brands\" style=\"max-width:100%;height:89px\"><\u002Fdiv>\n      <div style=\"flex:0 0 100%;height:90px;display:flex;align-items:center;justify-content:center\"><img src=\"fbf01049-8667-42b0-a801-9597aa51fb8f\" alt=\"Logo for Human Change, depicting a mind dissolving into pieces.\" style=\"max-width:100%;height:90px\"><\u002Fdiv>\n      <div style=\"flex:0 0 100%;height:90px;display:flex;align-items:center;justify-content:center\"><img src=\"f10105e6-2a71-464f-a542-37179384724e\" alt=\"\" style=\"max-width:100%;max-height:90px;height:auto\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<section style=\"margin-top:clamp(64px, (100vw - 767px) * 999, 128px);padding:0 clamp(10px, (767px - 100vw) * 999, 20px)\">\n  <div style=\"max-width:1140px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px\">\n    <div style=\"flex:1 1 565px;max-width:565px;box-sizing:border-box;padding:clamp(0px, (100vw - 767px) * 999, 20px) clamp(0px, (100vw - 767px) * 999, 10px) 0\">\n      <h2 style=\"max-width:545px;font-size:clamp(29.18px, (100vw - 767px) * 999, 44px);line-height:clamp(37.94px, (100vw - 767px) * 999, 57.2px);font-weight:600;color:#001A33\">The Psychological Effects of AI: What the Research Is Showing<\u002Fh2>\n      <img data-fade=\"1\" src=\"df45f1c4-0dec-4ead-8f1e-1119a33469f9\" alt=\"Continuous linework image of an abstract silhouette of a head with a line that passes through it and gets tied up, forming cogs and ultimately a question mark.\" style=\"display:block;width:482px;max-width:100%;height:auto;margin:20px 0 0 clamp(0px, (100vw - 767px) * 999, 32px)\">\n    <\u002Fdiv>\n    <div style=\"flex:1 1 555px;max-width:555px;box-sizing:border-box;padding-top:clamp(0px, (100vw - 767px) * 999, 10px);display:flex;flex-direction:column;gap:24px\">\n      <p>Artificial intelligence is not just a tool. It has rapidly become a profound influence on how millions worldwide relate to technology, other people, and themselves.<\u002Fp>\n      <p>While these technologies offer immense potential, their widespread adoption has also given rise to a new and complex set of psychological phenomena that require careful, objective study.<\u002Fp>\n      <p>The psychological effects being documented span a wide spectrum. On the concerning end, clinicians and researchers are observing patterns that include compulsive use, cognitive dependency, identity disruption, emotional dysregulation, and in some cases, serious mental health impacts.<\u002Fp>\n      <p>The full scope and nature of these effects remain under active study: How many people are affected, and in what ways? What role do individual differences play? Which groups may face greater risk — and which may benefit most?<\u002Fp>\n      <p><strong>Download our Literature Review below to read more.<\u002Fstrong><\u002Fp>\n      <a href=\"https://aiprc.org/wp-content/uploads/2026/10/AIPRC-Literature-Review-Digital-Edition-October-2026.pdf\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;justify-content:space-between;width:383px;max-width:100%;min-height:95px;box-sizing:border-box;background:#E9F5FE;border-radius:16px;padding:4px clamp(24px, (100vw - 767px) * 999, 29px) 4px 14px;color:#001A33\" style-hover=\"background:#C3D8EA\">\n        <span style=\"width:clamp(218px, (100vw - 767px) * 999, 243px)\"><strong>AIPRC 2026 Literature Review<\u002Fstrong>: The State of Research on AI &amp; Human Psychology<\u002Fspan>\n        <img src=\"7d384945-1388-41c2-b533-6e540fb4dc09\" alt=\"Download document icon\" style=\"width:52px;height:55px;flex:none\">\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin-top:clamp(64px, (100vw - 767px) * 999, 128px);padding:0 clamp(10px, (767px - 100vw) * 999, 20px)\">\n  <div style=\"max-width:1140px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:clamp(20px, (100vw - 767px) * 999, 48px)\">\n    <div style=\"flex:1 1 471px;max-width:471px;box-sizing:border-box;padding:clamp(0px, (100vw - 767px) * 999, 20px) clamp(0px, (100vw - 767px) * 999, 10px) 0\">\n      <h2 style=\"font-size:clamp(29.18px, (100vw - 767px) * 999, 44px);line-height:clamp(37.94px, (100vw - 767px) * 999, 57.2px);font-weight:600;color:#001A33\">Our Research<\u002Fh2>\n      <div style=\"margin-top:20px;display:flex;flex-direction:column;gap:clamp(0px, (100vw - 767px) * 999, 24px)\">\n        <p>We are building a comprehensive, anonymized dataset to understand the evolving — and increasingly complex — relationship between humans and AI.<\u002Fp>\n        <p>We provide a secure, anonymized system for submission of real-world accounts, including stories, screenshots, links, and chat logs.<\u002Fp>\n        <p>Our mission is not to condemn AI technology, but to ensure its development is guided by a clear, evidence-based understanding of human psychological integrity.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin:clamp(30px, (100vw - 767px) * 999, 54px) 0 0 clamp(0px, (100vw - 767px) * 999, 10px);display:flex\">\n        <a href=\"{{ r.about }}\" style=\"padding:12px 24px;border-radius:64px;background:#C3D8EA;color:#001A33;font-size:15px;line-height:15px;font-weight:500\" style-hover=\"background:#E9F5FE\">Learn more<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 621px;max-width:621px;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(289px, (767px - 100vw) * 999, 335px),1fr));gap:clamp(10px, (100vw - 767px) * 999, 20px) 22px\">\n      <div style=\"display:flex;align-items:center\">\n        <div style=\"flex:none;width:clamp(69px, (767px - 100vw) * 999, 112px);box-sizing:border-box;padding-right:clamp(0px, (100vw - 767px) * 999, 23px);display:flex;justify-content:center\"><img src=\"ee1ff1d7-e86d-4d38-b1ba-684b10ed06e5\" alt=\"Icon of document.\" style=\"width:40px;height:49px\"><\u002Fdiv>\n        <p style=\"max-width:clamp(207px, (767px - 100vw) * 999, 224px);padding-left:clamp(0px, (100vw - 767px) * 999, 10px)\">Document and understand the full range of psychological effects.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center\">\n        <div style=\"flex:none;width:clamp(69px, (767px - 100vw) * 999, 112px);box-sizing:border-box;padding-right:clamp(0px, (100vw - 767px) * 999, 23px);display:flex;justify-content:center\"><img src=\"a584fe72-6c0c-42a5-8050-29f68ad21470\" alt=\"Icon of a man reading text.\" style=\"width:46px;height:39px\"><\u002Fdiv>\n        <p style=\"max-width:clamp(207px, (767px - 100vw) * 999, 224px);padding-left:clamp(0px, (100vw - 767px) * 999, 10px)\">Support clinicians in recognizing and treating AI-related health conditions.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center\">\n        <div style=\"flex:none;width:clamp(69px, (767px - 100vw) * 999, 112px);box-sizing:border-box;padding-right:clamp(0px, (100vw - 767px) * 999, 23px);display:flex;justify-content:center\"><img src=\"a3c4a1b5-09f9-424c-866d-4ec5cb04cdf5\" alt=\"Icon of a magnifying glass in front of shield.\" style=\"width:40px;height:49px\"><\u002Fdiv>\n        <p style=\"max-width:clamp(207px, (767px - 100vw) * 999, 224px);padding-left:clamp(0px, (100vw - 767px) * 999, 10px)\">Inform safer AI design and public policy.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center\">\n        <div style=\"flex:none;width:clamp(69px, (767px - 100vw) * 999, 112px);box-sizing:border-box;padding-right:clamp(0px, (100vw - 767px) * 999, 23px);display:flex;justify-content:center\"><img src=\"50eeaea8-ff1f-42a0-8f29-9ccdc86009dd\" alt=\"Icon of a health plus symbol in front of shield.\" style=\"width:40px;height:51px\"><\u002Fdiv>\n        <p style=\"max-width:clamp(207px, (767px - 100vw) * 999, 224px);padding-left:clamp(0px, (100vw - 767px) * 999, 10px)\">Help people use these tools in healthier, more sustainable ways.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contribute\" style=\"margin-top:clamp(64px, (100vw - 767px) * 999, 128px);padding:clamp(0px, (100vw - 767px) * 999, 32px) clamp(10px, (767px - 100vw) * 999, 20px);background:#fff url(&quot;431c59e8-e7f6-4eaa-8bc0-1fdd2e7fdf1c&quot;) center/cover no-repeat;scroll-margin-top:90px\">\n  <div style=\"max-width:1140px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:20px\">\n    <div style=\"flex:1 1 565px;max-width:565px;display:flex;justify-content:center\">\n      <img data-fade=\"1\" src=\"ab7aed94-7787-44a7-afe4-845613bf9281\" alt=\"Continuous linework image of an abstract woman using her laptop.\" style=\"display:block;width:clamp(295px, (100vw - 767px) * 999, 493px);max-width:100%;height:auto\">\n    <\u002Fdiv>\n    <div style=\"flex:1 1 555px;max-width:555px\">\n      <h2 style=\"font-size:clamp(29.18px, (100vw - 767px) * 999, 44px);line-height:clamp(37.94px, (100vw - 767px) * 999, 57.2px);font-weight:600;color:#001A33\">How to Submit your Research Contribution<\u002Fh2>\n      <div style=\"margin-top:20px;display:flex;flex-direction:column;gap:24px\">\n        <p>Submissions are used exclusively for academic research. Participation is anonymous, voluntary, and takes about 10-15 minutes, and is open to adults ages 18 or older. You’ll be asked to share your experience and answer a few short questions.<\u002Fp>\n        <p>We do not collect any personally identifiable information, and you should not include medical records or other sensitive data in your submission. The information you provide will be stored securely and will only be viewed by the research team.<\u002Fp>\n        <p>By contributing to this initiative, you are helping to build a more informed, psychologically resilient future for everyone.<\u002Fp>\n        <p>We recognize that many individuals are navigating this new landscape with a mix of curiosity, optimism, and concern — whether for themselves, their loved ones, or society at large.<\u002Fp>\n        <p>Our work is grounded in the compassionate understanding that <strong>human well-being must remain at the core of technological advancement.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top:43px;display:flex\">\n        <a href=\"#submit\" style=\"padding:12px 24px;border-radius:64px;background:#C3D8EA;color:#001A33;font-size:15px;line-height:15px;font-weight:500\" style-hover=\"background:#E9F5FE\">Submit your experience<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin-top:clamp(64px, (100vw - 767px) * 999, 128px);padding:0 clamp(10px, (767px - 100vw) * 999, 20px)\">\n  <div style=\"max-width:1140px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:clamp(0px, (767px - 100vw) * 999, 40px)\">\n    <div style=\"flex:1 1 560px;max-width:560px;box-sizing:border-box;padding:clamp(0px, (100vw - 767px) * 999, 20px) clamp(0px, (100vw - 767px) * 999, 10px) clamp(0px, (100vw - 767px) * 999, 30px)\">\n      <h2 style=\"font-size:clamp(29.18px, (100vw - 767px) * 999, 44px);line-height:clamp(37.94px, (100vw - 767px) * 999, 57.2px);font-weight:600;color:#001A33\">Submit Your Story, Securely and Anonymously<\u002Fh2>\n      <p style=\"margin-top:20px\">Your experience is a vital piece of the scientific puzzle. We have designed this platform to make your submission as simple and secure as possible. There are several types of information you can share. The submission form describes the types of data that are helpful for this research.<\u002Fp>\n      <div style=\"margin-top:20px;display:flex;flex-direction:column;gap:clamp(10px, (767px - 100vw) * 999, 12px)\">\n        <div style=\"display:flex;align-items:center;gap:7px\"><img src=\"22864515-4a93-45e4-a8af-0f5347a02856\" alt=\"\" style=\"width:28px;height:28px\"><span>Secure data transmission<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px\"><img src=\"22864515-4a93-45e4-a8af-0f5347a02856\" alt=\"\" style=\"width:28px;height:28px\"><span>Anonymous submission<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:7px\"><img src=\"22864515-4a93-45e4-a8af-0f5347a02856\" alt=\"\" style=\"width:28px;height:28px\"><span>Ethical research practices<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:31px;display:flex\">\n        <a href=\"#submit\" style=\"padding:12px 24px;border-radius:64px;background:#C3D8EA;color:#001A33;font-size:15px;line-height:15px;font-weight:500\" style-hover=\"background:#E9F5FE\">Submit<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 580px;max-width:580px;display:flex;justify-content:center\">\n      <img data-fade=\"1\" src=\"1a6c3ed0-43ff-4b6a-98ce-ae270389d71f\" alt=\"A single-line drawing of a left-pointing arrow intersecting with a shield, representing authenticity and verification.\" style=\"display:block;width:clamp(315px, (100vw - 767px) * 999, 471px);max-width:100%;height:auto\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin-top:clamp(64px, (100vw - 767px) * 999, 128px);padding:10px clamp(10px, (100vw - 767px) * 999, 10px) clamp(33px, (100vw - 767px) * 999, 162px);background:url(&quot;0f8df8f7-60eb-4895-939a-f69087f94ca3&quot;) center/contain no-repeat\">\n  <h3 style=\"max-width:1120px;margin:0 auto;text-align:center;font-size:clamp(25.54px, (100vw - 767px) * 999, 36px);line-height:clamp(33.2px, (100vw - 767px) * 999, 46.8px);font-weight:600;color:#001A33\">Your submission could include:<\u002Fh3>\n  <div style=\"margin-top:clamp(42px, (100vw - 767px) * 999, 51px);display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(40px, (767px - 100vw) * 999, 45px)\">\n    <div style=\"width:clamp(347px, (767px - 100vw) * 999, 355px);max-width:100%;display:flex;flex-direction:column;align-items:center;text-align:center\">\n      <div style=\"height:68px;display:flex;align-items:center\"><img src=\"ac8c7c01-8104-44c8-b94a-85f99ac8640c\" alt=\"Text icon of 3 lines of text\" style=\"width:67px;height:42px\"><\u002Fdiv>\n      <p style=\"margin-top:clamp(31px, (767px - 100vw) * 999, 32px);font-size:clamp(22px, (100vw - 767px) * 999, 28px);line-height:clamp(24px, (100vw - 767px) * 999, 46.2px)\">Chat Logs or Screenshots<\u002Fp>\n      <p style=\"margin-top:20px\">Easily upload files or paste text from your interactions.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:clamp(347px, (767px - 100vw) * 999, 355px);max-width:100%;display:flex;flex-direction:column;align-items:center;text-align:center\">\n      <div style=\"height:68px;display:flex;align-items:center\"><img src=\"57acc911-5b12-4613-aa61-cfa24bb4d773\" alt=\"Screenshot icon\" style=\"width:84px;height:68px\"><\u002Fdiv>\n      <p style=\"margin-top:clamp(31px, (767px - 100vw) * 999, 32px);font-size:clamp(22px, (100vw - 767px) * 999, 28px);line-height:clamp(24px, (100vw - 767px) * 999, 46.2px)\">Provide a Link<\u002Fp>\n      <p style=\"margin-top:20px\">Drop a link to a relevant public post, blog, or video.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:clamp(347px, (767px - 100vw) * 999, 355px);max-width:100%;display:flex;flex-direction:column;align-items:center;text-align:center\">\n      <div style=\"height:68px;display:flex;align-items:center\"><img src=\"1f807cf4-a4ff-4a45-8502-1b9e8f1b7888\" alt=\"Link attachment icon\" style=\"width:84px;height:42px\"><\u002Fdiv>\n      <p style=\"margin-top:clamp(31px, (767px - 100vw) * 999, 32px);font-size:clamp(22px, (100vw - 767px) * 999, 28px);line-height:clamp(24px, (100vw - 767px) * 999, 46.2px)\">Written Account<\u002Fp>\n      <p style=\"margin-top:20px\">Share your story or observation in your own words.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#E9F5FE;border-radius:clamp(32px, (100vw - 767px) * 999, 64px) clamp(32px, (100vw - 767px) * 999, 64px) 0 0;padding:clamp(20px, (100vw - 767px) * 999, 74px) clamp(10px, (767px - 100vw) * 999, 40px) clamp(24px, (100vw - 767px) * 999, 98px) clamp(10px, (767px - 100vw) * 999, 20px)\">\n  <h2 style=\"max-width:686px;margin:0 auto;text-align:{{ ta }};font-size:clamp(29.18px, (100vw - 767px) * 999, 44px);line-height:clamp(37.94px, (100vw - 767px) * 999, 57.2px);font-weight:600;color:#001A33\">Behavioral Data Research Initiative<\u002Fh2>\n  <p style=\"max-width:753px;margin:clamp(0px, (100vw - 767px) * 999, 20px) auto 0;text-align:{{ ta }}\">We seek to understand and address the emerging psychological effects of AI — particularly for the developing minds of children, adolescents, and other groups who may be especially susceptible — by informing the development of clinical tools and helping shape future AI technology and policy.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"submit\" style=\"background:#001A33;padding:clamp(74px, (100vw - 767px) * 999, 122px) clamp(10px, (767px - 100vw) * 999, 30px) clamp(106px, (100vw - 767px) * 999, 138px);text-align:center\">\n  <div style=\"max-width:680px;margin:0 auto;display:flex;flex-direction:column;align-items:center\">\n    <h2 style=\"font-size:clamp(29.18px, (100vw - 767px) * 999, 44px);line-height:clamp(37.94px, (100vw - 767px) * 999, 57.2px);font-weight:600;color:#fff\">Have you noticed changes from using AI tools?<\u002Fh2>\n    <p style=\"margin-top:20px;color:#E9F5FE\">Have you or someone you know noticed changes — positive or negative — in behavior, mood, thinking patterns, or relationships following regular use of AI tools like ChatGPT or Gemini?<\u002Fp>\n    <a href=\"https://unc.az1.qualtrics.com/jfe/form/SV_cuSsV79I0PwWJcG\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:44px;display:inline-flex;align-items:center;justify-content:center;width:269px;height:61px;box-sizing:border-box;padding:20px 40px;border-radius:64px;border:3px solid #001A33;background:#E9F5FE;color:#001A33;font-size:15px;line-height:15px;font-weight:700\" style-hover=\"background:#C3D8EA;color:#001A33\">Contribute your experience<\u002Fa>\n    <p style=\"margin-top:clamp(49px, (100vw - 767px) * 999, 52px);color:#A3A7AC\">For questions or concerns about your rights as a research subject, please contact the Institutional Review Board at 919-966-3113 or by email to <a href=\"mailto:IRB_subjects@unc.edu\" style=\"color:#A3A7AC;text-decoration:underline\">IRB_subjects@unc.edu<\u002Fa>.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer>\n  <div style=\"background:#E9F5FE;padding:clamp(20px, (100vw - 767px) * 999, 32px) clamp(10px, (767px - 100vw) * 999, 20px) clamp(20px, (100vw - 767px) * 999, 32px)\">\n    <div style=\"max-width:1140px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px\">\n      <div style=\"flex:0 1 667px;box-sizing:border-box;background:#C3D8EA;border-radius:20px;padding:20px\">\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <h3 style=\"font-size:clamp(25.54px, (100vw - 767px) * 999, 36px);line-height:clamp(33.2px, (100vw - 767px) * 999, 46.8px);font-weight:600;color:#001A33\">Disclaimer<\u002Fh3>\n          <img src=\"7b392cb9-355d-476b-b20e-b6841ce316cc\" alt=\"Icon of caution symbol.\" style=\"width:36px;height:31px\">\n        <\u002Fdiv>\n        <p style=\"margin-top:clamp(9px, (767px - 100vw) * 999, 16px);padding-left:clamp(0px, (100vw - 767px) * 999, 10px);max-width:607px\">This website is a scientific research initiative and does not offer medical or psychological advice. If you are experiencing a mental health crisis or emergency, please contact a qualified professional or a crisis hotline immediately<\u002Fp>\n        <sc-if value=\"{{ d }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin-top:21px;padding-left:10px\"><strong>National Hotline for Mental Health Crises and Suicide Prevention<\u002Fstrong><\u002Fp>\n          <div style=\"margin-top:30px;padding-left:10px;max-width:607px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));justify-items:center\">\n            <p><strong>Call<\u002Fstrong><br><a href=\"tel:18009506264\">1-800-950-6264<\u002Fa><\u002Fp>\n            <p><strong>Text<\u002Fstrong><br>“NAMI” to 6240<\u002Fp>\n            <p><strong>In a crisis?<\u002Fstrong><br>Text or call <a href=\"tel:988\">988<\u002Fa><\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:clamp(18px, (100vw - 767px) * 999, 20px);padding-top:clamp(0px, (100vw - 767px) * 999, 10px)\">\n        <div style=\"width:clamp(150px, (100vw - 767px) * 999, 173px);display:flex;flex-direction:column\">\n          <a href=\"#top\" style=\"height:36px;display:flex;align-items:center;color:#000\">Home<\u002Fa>\n          <a href=\"{{ r.about }}\" style=\"height:36px;display:flex;align-items:center;color:#000\">About<\u002Fa>\n          <a href=\"{{ r.news }}\" style=\"height:36px;display:flex;align-items:center;color:#000\">News<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"width:clamp(167px, (10 \n    this.timer = setInterval(() => {\n      if (!this.state.m) return;\n      this.setState(s => ({ idx: s.idx + 1, anim: true }), () => {\n        if (this.state.idx >= 4) this.reset = setTimeout(() => this.setState({ idx: 0, anim: false }), 1000);\n      });\n    }, 4000);\n    this.onMove = (e) => {\n      const el = this.heroBgRef.current; if (!el) return;\n      const x = (e.clientX / window.innerWidth - 0.5) * -16, y = (e.clientY / window.innerHeight - 0.5) * -10;\n      el.style.transform = `translate(${x}px, ${y}px)`;\n    };\n    window.addEventListener('mousemove', this.onMove);\n    const els = [...document.querySelectorAll('[data-fade]')];\n    this.io = new IntersectionObserver((entries) => entries.forEach(en => {\n      if (en.isIntersecting) { en.target.style.opacity = '1'; this.io.unobserve(en.target); }\n    }), { threshold: 0.1 });\n    els.forEach(el => {\n      const delay = el.dataset.fade === 'bg' ? '0.5s' : '0s';\n      el.style.opacity = '0';\n      el.style.transition = `opacity 1.25s ease ${delay}` + (el.dataset.fade === 'bg' ? ', transform 0.6s ease-out' : '');\n      this.io.observe(el);\n    });\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('mousemove', this.onMove);\n    clearInterval(this.timer); clearTimeout(this.reset); this.io && this.io.disconnect();\n  }\n  renderVals() {\n    const { m, menu, idx, anim } = this.state;\n    const dev = /\\.dc\\.html$/.test(decodeURIComponent(location.pathname));\n    const r = dev\n      ? { home: 'AIPRC Home v2.dc.html', about: 'About.dc.html', news: 'News.dc.html', contact: 'Contact.dc.html', privacy: 'Privacy Policy.dc.html' }\n      : { home: '/', about: '/about/', news: '/news/', contact: '/contact/', privacy: '/privacy-policy/' };\n    return {\n      r, m, d: !m, ta: m ? 'left' : 'center',\n      menuOpen: menu && m,\n      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),\n      closeMenu: () => this.setState({ menu: false }),\n      heroBgRef: this.heroBgRef,\n      tx: `translateX(-${idx * 100}%)`,\n      trans: anim ? 'transform 1s ease' : 'none',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
